name: pymdmix3
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # numpy<2 y biopython<1.86 mantienen compatibles las herramientas de Python de AmberTools
  - numpy<2
  - scipy>=1.7
  - matplotlib
  - netcdf4
  - cftime
  - biopython<1.86
  - mechanize
  - ambertools
  # solo para construir cajas de solvente (examples/solvent_boxes)
  - packmol
  - pip:
      - biskit>=3.0
      - griddataformats
