# =============================================================================
# pyMDMix: project configuration file (complete template)
#
# Usage:
#   mdmix create project -n NAME -f this_file.cfg
#
# Format rules:
#   - Comments go on their own lines (not at the end of an option).
#   - Empty options must be commented out or removed.
#   - Option names are case insensitive.
# =============================================================================

[SYSTEM]
# Name that identifies the system (mandatory)
NAME = MySystem

# Amber Object File (.off) with the UNSOLVATED system unit (mandatory)
# If the path is relative, the folder of this file is searched too.
OFF = mysystem.off

# Unit inside the .off that contains the system (default: the first one)
#UNAME = MYSYSTEM

# Non-standard residues that are part of the solute and not of the solvent
# (comma separated list). Used by the automatic mask detection.
#EXTRARES = HEM,LIG

# ADDITIONAL force fields or frcmod files for tLeap (comma separated list).
# They are loaded after the default FF listed in md-settings.cfg
# (leaprc.protein.ff19SB, leaprc.gaff2 and leaprc.water.opc). The default water is OPC;
# for boxes with another water model (for example TIP3P) add its leaprc here.
#EXTRAFF = leaprc.water.tip3p, ligand.frcmod

[MDSETTINGS]
# ------------------------------- main options --------------------------------
# Solvents of the project (comma separated list, mandatory)
SOLVENTS = ETAO

# Number of replicas per solvent. Examples: 3   |   ETAO:5, WAT:1
NREPL = 5

# Production nanoseconds. Examples: 20   |   ETAO:50, WAT:10
NANOS = 20

# Temperature in K
TEMP = 310

# Positional restraints: FREE (none), HA (heavy atoms), BB (backbone)
RESTR = HA

# Restraint force constant, in kcal/mol/A^2 (if RESTR is not FREE)
FORCE = 0.1

# Solute residues that are restrained (default: automatic detection).
# Example: 1-100
#RESTRMASK = auto

# Residues whose backbone is used to align the trajectories (default: same
# as RESTRMASK). Example: 1-100,120-240
#ALIGNMASK = auto

# ------------------------- advanced options (optional) -----------------------
# Any option of md-settings.cfg can be changed here. The most useful ones:

# Dynamics program: AMBER, NAMD or OPENMM
#MDPROGRAM = AMBER

# Integration time step in fs. With 4 fs the topology needs hydrogen mass
# repartitioning (HMR); pyMDMix does not apply it for you
# (see examples/md_tools/apply_4fs_hmr.sh).
#MD_TIMESTEP = 2

# Trajectory writing frequency, in steps
#TRAJFREQUENCY = 500

# Steps of each heating file (eq1 to eq4), of the NPT equilibration (eq5)
# and of each production file (md). With 2 fs, 500000 steps = 1 ns.
#HEATING_STEPS = 100000
#NPT_EQ_STEPS = 500000
#PROD_STEPS = 500000

# Production ensemble: NVT or NPT
#PRODUCTION_ENSEMBLE = NVT

# Re-wrap the box during the dynamics (1) or not (0). With 1 and restraints,
# pyMDMix also writes the check_com.sh script.
#IWRAP = 1
